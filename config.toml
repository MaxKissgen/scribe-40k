# scribe-40k model selection.
#
# API keys are NEVER read from this file -- only from the environment, so this file is
# safe to commit. See .env.example for the variable each provider expects.

[ocr]
# Turns page images into text. Handwriting accuracy is what matters here.
#   mistral       -- mistral-ocr-latest, a purpose-built document endpoint
#   openai        -- or openrouter / together / groq / ollama / lmstudio / vllm / azure
#   anthropic     -- Claude vision
#   passthrough   -- use the PDF's own text layer, no API call
#   fixture       -- replay recorded responses from disk, no API call
provider = "mistral"
model    = "mistral-ocr-latest"

[reasoning]
# Maps that text onto the character schema. Instruction-following is what matters here.
#
# Prefer a vision-capable model: the ticked boxes in the skills grid and the weapon
# training block are most of the data on this sheet, and OCR renders them all as
# identical glyphs. A text-only model will under-report them.
provider = "anthropic"
model    = "claude-opus-5"

# Point at any OpenAI-compatible endpoint instead:
#   provider = "openrouter"
#   model    = "openai/gpt-5"
# ...or something running locally, which needs no key at all:
#   provider = "ollama"
#   model    = "llama3.2-vision"

[cache]
# Cache OCR and mapping results on disk, keyed by page content and model. Iterating on
# prompts then costs nothing, because the expensive transcription step is reused.
enabled = true
