[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribe40k"
version = "0.1.0"
description = "Extract, edit and export Dark Heresy 1st Edition character sheets"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pymupdf>=1.24",
    "pillow>=10.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
export = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
scribe = "scribe40k.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/scribe40k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["scribe40k"]
